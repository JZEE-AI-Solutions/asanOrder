# Render.com Blueprint — AsanOrder
# ─────────────────────────────────────────────────────────────────────────────
# Database is Render-managed Postgres (free tier — 1 GB, 90-day expiry).
# Create it in the dashboard first, then set DATABASE_URL on the API service
# from its "Internal Database URL".
#
# Backend on Render free tier (512 MB RAM):
#   - CLIP-Large embedding will fail to load → embeddings/visual-search disable
#     gracefully (chat + dashboard + quick-add still work, just without visual
#     re-ID for new uploads).
#   - For full visual matching you'll need to upgrade to Standard ($25/mo, 2 GB).
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: asanorder-db
    plan: free
    region: singapore
    databaseName: asanorder
    user: asanorder_user

services:

  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: asanOrderAPI
    env: node
    plan: free
    region: singapore
    branch: main
    rootDir: .
    buildCommand: |
      cd backend && \
      npm ci --no-audit --no-fund && \
      npx prisma generate && \
      npx prisma db push --accept-data-loss
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"        # leave headroom on 512 MB tier
      - key: PORT
        value: 10000
      # ── Database (Render Postgres) ───────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: asanorder-db
          property: connectionString
      # ── Auth ─────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      # ── Uploads (legacy local FS — note free tier disk is ephemeral) ─
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE
        value: 5242880
      # ── AI Agent ─────────────────────────────────────────────────────
      - key: AI_PROVIDER
        value: anthropic                          # switch to openai if needed
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514
      - key: OPENAI_API_KEY
        sync: false                               # optional fallback
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: AGENT_MODE
        value: supervised
      - key: AGENT_OWNER_PHONE
        sync: false
      # ── WhatsApp Meta Cloud API ──────────────────────────────────────
      - key: META_ACCESS_TOKEN
        sync: false                               # rotate every 24h OR use long-lived
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_WABA_ID
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WEBHOOK_BASE_URL
        value: https://asanorder.onrender.com  # this service's URL
      # ── CORS / Frontend ──────────────────────────────────────────────
      - key: FRONTEND_URL
        value: https://asanorderui.onrender.com,https://asanorder-ui.onrender.com

  # ── Frontend (Vite SPA + PWA) ──────────────────────────────────────────────
  - type: web
    name: asanOrderUI
    env: static
    plan: free
    region: singapore
    branch: main
    rootDir: .
    buildCommand: cd frontend && npm ci --no-audit --no-fund && npm run build
    staticPublishPath: frontend/dist
    # SPA fallback so React Router works on hard-refresh
    routes:
      - type: rewrite
        source: /api/*
        destination: https://asanorder.onrender.com/api/:splat
      - type: rewrite
        source: /uploads/*
        destination: https://asanorder.onrender.com/uploads/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://asanorder.onrender.com
